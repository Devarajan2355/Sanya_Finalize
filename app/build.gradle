plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.sanya.assistant'
    compileSdk 34
    defaultConfig {
        applicationId 'com.sanya.assistant'
        minSdk 26
        targetSdk 28   // 28 (not 29+) so Wi-Fi can be switched directly
        versionCode 6
        versionName '6.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    signingConfigs {
        debug {
            if (file('sanya.keystore').exists()) {
                storeFile file('sanya.keystore')
                // Reads GitHub Actions secrets when present. The fallback keeps today's build working;
                // delete the  ?: 'sanya1234'  parts once the secrets are set.
                storePassword System.getenv('SANYA_KEYSTORE_PASSWORD') ?: 'sanya1234'
                keyAlias 'sanya'
                keyPassword System.getenv('SANYA_KEY_PASSWORD') ?: 'sanya1234'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47'
}
