plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.sanya.assistant'
    compileSdk 34
    defaultConfig {
        applicationId 'com.sanya.assistant'
        minSdk 26
        targetSdk 29
        versionCode 5
        versionName '5.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    signingConfigs {
        debug {
            if (file('sanya.keystore').exists()) {
                storeFile file('sanya.keystore')
                storePassword 'sanya1234'
                keyAlias 'sanya'
                keyPassword 'sanya1234'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47'
}
